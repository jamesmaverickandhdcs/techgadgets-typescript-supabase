<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechGadgets</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
      }
    }
    </script>
</head>

<body>
    <header>
        <h1>🚀 TechGadgets</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart (0)</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <div id="auth-forms">
                <div id="login-form" class="auth-form">
                    <h2>Login</h2>
                    <form id="login-form-element">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" required>
                        </div>
                        <button type="submit">Login</button>
                        <p class="switch-form">
                            Don't have an account?
                            <a href="#" id="show-signup">Sign up</a>
                        </p>
                    </form>
                </div>

                <div id="signup-form" class="auth-form" style="display: none;">
                    <h2>Sign Up</h2>
                    <form id="signup-form-element">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" minlength="6" required>
                        </div>
                        <button type="submit">Sign Up</button>
                        <p class="switch-form">
                            Already have an account?
                            <a href="#" id="show-login">Login</a>
                        </p>
                    </form>
                </div>
            </div>

            <div id="user-dashboard" style="display: none;">
                <h2>Welcome, <span id="user-name"></span>!</h2>
                <p>Email: <span id="user-email"></span></p>
                <button id="logout-btn">Logout</button>
                <a href="index.html" class="continue-btn">Continue Shopping</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 TechGadgets. Built with TypeScript + Supabase</p>
    </footer>

    <script type="module" src="dist/auth.js"></script>
    <script type="module">
        import { initAuthPage, showSignupForm, updateNavigation } from './dist/auth.js';
        initAuthPage();
        updateNavigation();

        document.getElementById('show-signup')?.addEventListener('click', (e) => {
            e.preventDefault();
            showSignupForm();
        });

        document.getElementById('show-login')?.addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('signup-form').style.display = 'none';
        });
    </script>
</body>

</html>
