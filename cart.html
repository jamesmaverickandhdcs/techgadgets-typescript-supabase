<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - TechGadgets</title>
    <link rel="stylesheet" href="style.css">

    <script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
  }
}
</script>
</head>

<body>
    <header>
        <h1>🚀 TechGadgets</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart (0)</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main>
        <h2>Shopping Cart</h2>

        <div id="cart-items"></div>

        <div id="cart-summary">
            <h3>Order Summary</h3>
            <div class="summary-row">
                <span>Subtotal:</span>
                <span>$<span id="subtotal">0.00</span></span>
            </div>
            <div class="summary-row">
                <span>Shipping:</span>
                <span>$<span id="shipping">0.00</span></span>
            </div>
            <div class="summary-row total">
                <span>Total:</span>
                <span>$<span id="total">0.00</span></span>
            </div>
            <a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>
        </div>

        <div id="empty-cart" style="display: none;">
            <p>Your cart is empty!</p>
            <a href="products.html" class="continue-btn">Continue Shopping</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 TechGadgets. Built with TypeScript + Supabase</p>
    </footer>

    <script type="module" src="dist/cart.js"></script>
    <script type="module">
        import { initCartPage } from './dist/cart.js';
        initCartPage();
    </script>
</body>

</html>
